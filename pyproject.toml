[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haql-qc"
description = "Local-first production data QC for reservoir engineering. Deterministic rules, raw-preserving audit trails, and signed license enforcement."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
authors = [{ name = "haql" }]
license = { file = "LICENSE" }
keywords = ["oil", "gas", "production", "data-quality", "reservoir", "volve"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]

[project.scripts]
haql-qc = "haql_qc.cli:main"

[project.urls]
Homepage = "https://github.com/haql/haql-qc"
Repository = "https://github.com/haql/haql-qc"
Issues = "https://github.com/haql/haql-qc/issues"

[tool.hatch.version]
path = "haql_qc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["haql_qc"]

[project.optional-dependencies]
# Spreadsheet support is the only non-stdlib dependency, and only the
# ingest path needs it. The audit engine itself remains stdlib-only.
xlsx = ["openpyxl>=3.1.0"]
# cryptography is dev-only and never reaches an installed wheel. It exists so
# the pure-Python issuer signer can be differentially tested against a reference
# implementation; without it that test skips and the signer goes unverified.
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "cryptography>=42.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
warn_redundant_casts = true
warn_unused_ignores = true
strict = false
